table: password_vault_entry
purpose: 외부 서비스 계정의 vault 보관 위치 메타. 실제 비밀번호는 저장하지 않음 (CLAUDE.md Security).
section: 3-C 보안
decisions: []

columns:
  - name: id
    type: UUID
    nullable: false
    primary_key: true
    default: gen_random_uuid()
  - name: org_id
    type: UUID
    nullable: false
  - name: service_name
    type: TEXT
    nullable: false
    note: e.g. "쿠팡 Wing", "스마트스토어 판매자센터"
  - name: vault_provider
    type: TEXT
    nullable: false
    note: e.g. "Bitwarden", "1Password"
  - name: vault_item_name
    type: TEXT
    nullable: false
    note: vault 내부 item 이름 — 실제 비밀번호 아님
  - name: account_masked
    type: TEXT
    nullable: true
    note: 계정 ID 마스킹 (e.g. "ab***@example.com")
  - name: memo
    type: TEXT
    nullable: true
    note: 자유 메모. CHECK 제약으로 "비밀번호: xxx" / "pw=xxx" 패턴 차단

audit_columns: true
policy_columns: false

constraints:
  - name: ck_pve_memo_no_pw1
    type: CHECK
    expression: memo IS NULL OR memo !~* '비밀번호[ :=]*[A-Za-z0-9!@#$]+'
  - name: ck_pve_memo_no_pw2
    type: CHECK
    expression: memo IS NULL OR memo !~* '(pw|pass|pwd)[ :=]+[A-Za-z0-9!@#$]+'

indexes:
  - name: ix_pve_org_service
    type: INDEX
    columns: [org_id, service_name]

foreign_keys:
  - column: org_id
    references: organization.id

referenced_by:
  - external_partner.vault_entry_id
  - integration_account.credentials_vault_entry_id

notes: |
  - CLAUDE.md Security: 평문 비밀번호 절대 저장 금지. vault 는 보관위치만.
  - CHECK 제약 2종으로 memo 에 실수로 비밀번호 텍스트가 들어가는 패턴을 DB 단에서 차단.
  - 주민등록번호 등 고위험 개인정보도 저장 금지.
