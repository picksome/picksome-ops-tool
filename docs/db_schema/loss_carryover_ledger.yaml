table: loss_carryover_ledger
purpose: 손실 이월 원장. 적자 발생 / 흑자월 차감 / 수동 조정 이벤트 추적.
section: 3-G 판매/정산
decisions: []

columns:
  - name: id
    type: UUID
    nullable: false
    primary_key: true
    default: gen_random_uuid()
  - name: org_id
    type: UUID
    nullable: false
  - name: event_at
    type: DATE
    nullable: false
  - name: event_kind
    type: enum_carryover_event
    nullable: false
    enum_values: [LOSS_ADDED, OFFSET_APPLIED, MANUAL_ADJUST]
  - name: source_settlement_id
    type: UUID
    nullable: true
    note: LOSS_ADDED / OFFSET_APPLIED 의 대상 monthly_settlement
  - name: amount
    type: BIGINT
    nullable: false
    note: 원 단위 정수 (KRW). 부호 포함 (음수 = 차감)
  - name: balance_after
    type: BIGINT
    nullable: false
    note: 이벤트 적용 후 잔액. 원 단위 정수 (KRW)
  - name: reason
    type: TEXT
    nullable: true

audit_columns: true
policy_columns: false

constraints: []

indexes:
  - name: ix_lcl_org_event
    type: INDEX
    columns: [org_id, event_at DESC]

foreign_keys:
  - column: org_id
    references: organization.id
  - column: source_settlement_id
    references: monthly_settlement.id
    nullable: true

referenced_by: []

notes: |
  - CLAUDE.md: 적자월 분배 0, 손실은 누적되어 다음 흑자월에서 우선 차감 (carryover 정책).
  - balance_after 박제로 어느 시점이든 잔액 재현 가능.
